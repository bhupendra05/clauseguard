[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clauseguard"
version = "0.1.0"
description = "A red-flag linter for contracts — scan any agreement for risky clauses and missing protections."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Bhupendra Gurjar", email = "bgurjar05.bg@gmail.com" }]
keywords = ["contract", "legal", "clause", "risk", "nda", "due-diligence", "legaltech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
llm = ["anthropic>=0.39"]
dev = ["pytest>=7.0"]

[project.scripts]
clauseguard = "clauseguard.cli:main"

[project.urls]
Homepage = "https://github.com/bhupendra05/clauseguard"

[tool.pytest.ini_options]
testpaths = ["tests"]
